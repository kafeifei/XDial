name: XDial
options:
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  FormalDevelopment: release
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: UVZM439VGU
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # Source and CI builds use a neutral identity. `make release` is the only
    # distribution producer and overrides both values from its validated tag
    # and monotonically increasing build number.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Formal configurations retain their installed identity. Debug owns a
    # separate app, helper, extension, and data namespace.
    XDIAL_APPLICATION_BUNDLE_IDENTIFIER: com.kafeifei.xdial.app
    XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER: com.kafeifei.xdial.app.transparent-proxy
    XDIAL_SETTINGS_UI_BUNDLE_IDENTIFIER: com.kafeifei.xdial.app.settings-ui
    XDIAL_HELPER_IDENTIFIER: com.kafeifei.xdial.app.helper
    XDIAL_DAEMON_PLIST: com.kafeifei.xdial.app.daemon.plist
    XDIAL_DAEMON_ENTITLEMENTS: XDialDaemon.entitlements
    XDIAL_HELPER_SOURCE: "$(SRCROOT)/../build/xdial"
    XDIAL_PRODUCT_DISPLAY_NAME: XDial
    XDIAL_SETTINGS_ENTRY_IDENTIFIER: com.kafeifei.xdial.app.settings-entry
    XDIAL_BUILD_FLAVOR: release
    XDIAL_UPDATE_ACCEPTANCE_ID: ""
  configs:
    Debug:
      XDIAL_APPLICATION_BUNDLE_IDENTIFIER: com.kafeifei.xdial.debug
      XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER: com.kafeifei.xdial.debug.transparent-proxy
      XDIAL_SETTINGS_UI_BUNDLE_IDENTIFIER: com.kafeifei.xdial.debug.settings-ui
      XDIAL_HELPER_IDENTIFIER: com.kafeifei.xdial.debug.helper
      XDIAL_DAEMON_PLIST: com.kafeifei.xdial.debug.daemon.plist
      XDIAL_DAEMON_ENTITLEMENTS: XDialDaemonDebug.entitlements
      XDIAL_HELPER_SOURCE: "$(SRCROOT)/../build/xdial-debug"
      XDIAL_PRODUCT_DISPLAY_NAME: Xdial debug
      XDIAL_SETTINGS_ENTRY_IDENTIFIER: com.kafeifei.xdial.debug.settings-entry
      XDIAL_BUILD_FLAVOR: debug
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG XDIAL_DEVELOPMENT_IDENTITY"

targets:
  XDialTransparentProxy:
    type: system-extension
    platform: macOS
    sources:
      - TransparentProxyExtension
      - Shared
    info:
      path: TransparentProxyExtension/Info.plist
      properties:
        CFBundleDisplayName: "$(XDIAL_PRODUCT_DISPLAY_NAME) Network Extension"
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.app-proxy: "$(PRODUCT_MODULE_NAME).TransparentProxyProvider"
        NSSystemExtensionUsageDescription: XDial 使用网络扩展将线路、规则和场景交给 sing-box 统一执行。
    settings:
      base:
        # Apple requires a Network Extension system extension's filename to
        # match its bundle identifier exactly. PRODUCT_NAME controls the
        # outer .systemextension filename.
        PRODUCT_NAME: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_BUNDLE_IDENTIFIER: "$(XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER)"
        ENABLE_APP_SANDBOX: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: TransparentProxyExtension/XDialTransparentProxyDebug.entitlements
        FormalDevelopment:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: TransparentProxyExtension/XDialTransparentProxy.entitlements
          ENABLE_HARDENED_RUNTIME: YES
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: XDial Developer ID App Transparent Proxy
          CODE_SIGN_ENTITLEMENTS: TransparentProxyExtension/XDialTransparentProxyRelease.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - framework: ../build/frameworks/macos/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: NetworkExtension.framework
      - sdk: Security.framework

  XDialSettingsUI:
    type: application
    platform: macOS
    sources:
      - SettingsDockUI
      - Sources/XDial/SettingsDockProxyProtocol.swift
      - Shared/XDialBuildIdentity.swift
      - path: SettingsDockIcon.icns
        buildPhase: resources
    info:
      path: SettingsDockUI/Info.plist
      properties:
        CFBundleDisplayName: "$(XDIAL_PRODUCT_DISPLAY_NAME)"
        CFBundleName: "$(XDIAL_PRODUCT_DISPLAY_NAME)"
        CFBundleIconFile: SettingsDockIcon.icns
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: false
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_NAME: XDial Settings UI
        PRODUCT_BUNDLE_IDENTIFIER: "$(XDIAL_SETTINGS_UI_BUNDLE_IDENTIFIER)"
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
        FormalDevelopment:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          ENABLE_HARDENED_RUNTIME: YES
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          ENABLE_HARDENED_RUNTIME: YES

  XDial:
    type: application
    platform: macOS
    sources:
      - Sources/XDial
      - Shared
      - path: AppIcon.icns
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "$(XDIAL_PRODUCT_DISPLAY_NAME)"
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSystemExtensionUsageDescription: XDial 使用网络扩展将线路、规则和场景交给 sing-box 统一执行。
        NSLocationUsageDescription: XDial 使用当前 Wi-Fi 名称自动选择你配置的场景。
        NSLocationWhenInUseUsageDescription: XDial 使用当前 Wi-Fi 名称自动选择你配置的场景。
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: "$(XDIAL_SETTINGS_ENTRY_IDENTIFIER)"
            UTTypeConformsTo:
              - public.data
            UTTypeDescription: XDial Settings Reorder Item
        XDialBuildFlavor: "$(XDIAL_BUILD_FLAVOR)"
        XDialUpdateAcceptanceID: "$(XDIAL_UPDATE_ACCEPTANCE_ID)"
        XDialTransparentProxyBundleIdentifier: "$(XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER)"
    settings:
      base:
        PRODUCT_NAME: XDial
        PRODUCT_BUNDLE_IDENTIFIER: "$(XDIAL_APPLICATION_BUNDLE_IDENTIFIER)"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: XDialDebug.entitlements
          PRODUCT_NAME: Xdial debug
          PRODUCT_MODULE_NAME: XDial
          EXECUTABLE_NAME: XDial
        FormalDevelopment:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          CODE_SIGN_ENTITLEMENTS: XDial.entitlements
          ENABLE_HARDENED_RUNTIME: YES
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          PROVISIONING_PROFILE_SPECIFIER: XDial Developer ID App Host 2026
          CODE_SIGN_ENTITLEMENTS: XDialRelease.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: XDialSettingsUI
        embed: false
      - framework: ../build/frameworks/macos/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreLocation.framework
      - sdk: CoreWLAN.framework
    postBuildScripts:
      - name: Embed settings UI Dock carrier
        script: |
          set -eu
          carrier_source="${BUILT_PRODUCTS_DIR}/XDial Settings UI.app"
          carrier_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          carrier_destination="${carrier_dir}/XDial Settings UI.app"
          test -d "${carrier_source}"
          mkdir -p "${carrier_dir}"
          rm -rf "${carrier_destination}"
          /usr/bin/ditto "${carrier_source}" "${carrier_destination}"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            exit 0
          fi
          if [ "${CONFIGURATION}" = "Release" ]; then
            /usr/bin/codesign --force --options runtime --timestamp \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
              "${carrier_destination}"
          else
            /usr/bin/codesign --force \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
              "${carrier_destination}"
          fi
          /usr/bin/codesign --verify --deep --strict \
            "${carrier_destination}"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/XDial Settings UI.app"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/XDial Settings UI.app"
      - name: Embed private RuleSet presets
        script: |
          set -eu
          preset_source="${XDIAL_RULE_SET_PRESETS_FILE:-${SRCROOT}/PrivateConfig/RuleSetPresets.json}"
          preset_dir="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          preset_destination="${preset_dir}/RuleSetPresets.json"
          if [ -f "${preset_source}" ]; then
            mkdir -p "${preset_dir}"
            cp "${preset_source}" "${preset_destination}"
          else
            rm -f "${preset_destination}"
          fi
      - name: Embed configuration-matched System Extension
        script: |
          set -eu
          extension_name="${XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER}.systemextension"
          extension_source="${BUILT_PRODUCTS_DIR}/${extension_name}"
          extension_dir="${TARGET_BUILD_DIR}/${SYSTEM_EXTENSIONS_FOLDER_PATH}"
          test -d "${extension_source}"
          rm -rf "${extension_dir}"
          mkdir -p "${extension_dir}"
          /usr/bin/ditto \
            "${extension_source}" \
            "${extension_dir}/${extension_name}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "${extension_dir}/${extension_name}/Contents/Info.plist")" \
            = "${XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER}"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
            /usr/bin/codesign --verify --deep --strict \
              "${extension_dir}/${extension_name}"
          fi
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER).systemextension"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(SYSTEM_EXTENSIONS_FOLDER_PATH)/$(XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER).systemextension"
      - name: Embed and sign XDial helper
        script: |
          set -eu
          helper_source="${XDIAL_HELPER_SOURCE}"
          helper_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/MacOS"
          launchd_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          test -x "${helper_source}"
          mkdir -p "${helper_dir}" "${launchd_dir}"
          cp "${helper_source}" "${helper_dir}/xdial-daemon"
          cp "${SRCROOT}/${XDIAL_DAEMON_PLIST}" "${launchd_dir}/"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "NO" ]; then
            exit 0
          fi
          if [ "${CONFIGURATION}" = "Release" ]; then
            /usr/bin/codesign --force --options runtime --timestamp \
              --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
              --identifier "${XDIAL_HELPER_IDENTIFIER}" \
              --entitlements "${SRCROOT}/${XDIAL_DAEMON_ENTITLEMENTS}" \
              "${helper_dir}/xdial-daemon"
          else
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
              --identifier "${XDIAL_HELPER_IDENTIFIER}" \
              --entitlements "${SRCROOT}/${XDIAL_DAEMON_ENTITLEMENTS}" \
              "${helper_dir}/xdial-daemon"
          fi
        inputFiles:
          - "$(XDIAL_HELPER_SOURCE)"
          - "$(SRCROOT)/$(XDIAL_DAEMON_PLIST)"
          - "$(SRCROOT)/$(XDIAL_DAEMON_ENTITLEMENTS)"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/xdial-daemon"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(XDIAL_DAEMON_PLIST)"

  XDialTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
      - Sources/XDial/AppIcon.swift
      - Sources/XDial/AppDefaults.swift
      - Sources/XDial/ApplicationLaunchPolicy.swift
      - Sources/XDial/AppVersion.swift
      - Sources/XDial/AppUpdateStager.swift
      - Sources/XDial/AppUpdateChecker.swift
      - Sources/XDial/AppUpdateDownloader.swift
      - Sources/XDial/AppUpdateReleaseLookup.swift
      - Sources/XDial/AppUpdateTransaction.swift
      - Sources/XDial/ApplicationRelocator.swift
      - Sources/XDial/DebugStateRedactor.swift
      - Sources/XDial/Models.swift
      - Sources/XDial/ProfileVaultProjection.swift
      - Sources/XDial/Localization.swift
      - Sources/XDial/MenuBarStatusIcon.swift
      - Sources/XDial/MenuBarRecoveryPolicy.swift
      - Sources/XDial/MenuBarRecoveryController.swift
      - Sources/XDial/MenuBarTrackingRepair.swift
      - Sources/XDial/NetworkInfo.swift
      - Sources/XDial/RotaryDial.swift
      - Sources/XDial/ScenarioIconCatalog.swift
      - Sources/XDial/ScenarioGridLayout.swift
      - Sources/XDial/WiFiSSIDAccessPolicy.swift
      - Sources/XDial/XDialBrandPalette.swift
      - TransparentProxyExtension/ConnectionTransactionReporter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafeifei.xdial.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) XDIAL_TESTING"
