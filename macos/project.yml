name: XDial
options:
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release

settings:
  base:
    DEVELOPMENT_TEAM: UVZM439VGU
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER: com.kafeifei.xdial.ne-probe.extension
    Release:
      XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER: com.kafeifei.xdial.transparent-proxy

targets:
  XDialTransparentProxy:
    type: system-extension
    platform: macOS
    sources:
      - TransparentProxyExtension
      - Shared
    info:
      path: TransparentProxyExtension/Info.plist
      properties:
        CFBundleDisplayName: XDial Transparent Proxy
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.app-proxy: "$(PRODUCT_MODULE_NAME).TransparentProxyProvider"
        NSSystemExtensionUsageDescription: XDial 使用网络扩展将线路、规则和模式交给 sing-box 统一执行。
    entitlements:
      path: TransparentProxyExtension/XDialTransparentProxy.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - app-proxy-provider
        com.apple.security.application-groups:
          - UVZM439VGU.com.kafeifei.xdial.network
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "73"
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: TransparentProxyExtension/XDialTransparentProxy.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kafeifei.xdial.ne-probe.extension
          PRODUCT_NAME: com.kafeifei.xdial.ne-probe.extension
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kafeifei.xdial.transparent-proxy
          PRODUCT_NAME: com.kafeifei.xdial.transparent-proxy
    dependencies:
      - framework: ../build/frameworks/macos/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: NetworkExtension.framework
      - sdk: Security.framework

  XDial:
    type: application
    platform: macOS
    sources:
      - Sources/XDial
      - Shared
      - path: AppIcon.icns
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: XDial
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSystemExtensionUsageDescription: XDial 使用网络扩展将线路、规则和模式交给 sing-box 统一执行。
        XDialTransparentProxyBundleIdentifier: "$(XDIAL_TRANSPARENT_PROXY_BUNDLE_IDENTIFIER)"
    entitlements:
      path: XDial.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - app-proxy-provider
        com.apple.security.application-groups:
          - UVZM439VGU.com.kafeifei.xdial.network
        com.apple.developer.system-extension.install: true
    settings:
      base:
        PRODUCT_NAME: XDial
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "73"
        CODE_SIGN_ENTITLEMENTS: XDial.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.kafeifei.xdial.ne-probe
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.kafeifei.xdial
    dependencies:
      - target: XDialTransparentProxy
        embed: true
        codeSign: true
      - framework: ../build/frameworks/macos/Libbox.xcframework
        embed: false
      - sdk: libresolv.tbd
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
      - sdk: SystemConfiguration.framework
    postBuildScripts:
      - name: Embed and sign XDial helper
        script: |
          set -eu
          helper_source="${SRCROOT}/../build/xdial"
          helper_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/MacOS"
          launchd_dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          test -x "${helper_source}"
          mkdir -p "${helper_dir}" "${launchd_dir}"
          cp "${helper_source}" "${helper_dir}/xdial-daemon"
          cp "${SRCROOT}/com.kafeifei.xdial.helper.plist" "${launchd_dir}/"
          /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" \
            --entitlements "${SRCROOT}/XDialDaemon.entitlements" \
            "${helper_dir}/xdial-daemon"
        inputFiles:
          - "$(SRCROOT)/../build/xdial"
          - "$(SRCROOT)/com.kafeifei.xdial.helper.plist"
          - "$(SRCROOT)/XDialDaemon.entitlements"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/xdial-daemon"
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/com.kafeifei.xdial.helper.plist"

  XDialTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafeifei.xdial.tests
        GENERATE_INFOPLIST_FILE: YES
